name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests train
      - run: uv run pyright
      # Fast suite only: no GPU, no cloud calls. test_train_cpu.py skips without the training libraries.
      - run: uv run pytest -q
